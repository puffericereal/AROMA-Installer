name: Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkotu
      uses: actions/checkout@v4

    - name: Clone code
      run: |
        git clone https://github.com/amarullz/AROMA-Installer.git aroma_source

    - name: Install toolchain (arm)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf make libpng-dev zlib1g-dev

    - name: Compile
      run: |
        cd aroma_source
        export CC=arm-linux-gnueabihf-gcc
        export CXX=arm-linux-gnueabihf-g++
        export ARCH=arm
        if [ -f "Makefile" ]; then
          make -j$(nproc) || make
        elif [ -f "src/Makefile" ]; then
          cd src && make -j$(nproc)
        fi

    - name: Prepare artifact
      run: |
        mkdir -p output
        ls -R aroma_source/

        BIN_FILE=$(find aroma_source -type f \( -name "*aroma*" -o -name "*update-binary*" \) ! -name "*.c" ! -name "*.h" ! -name "*.o" ! -name "*.mk" | head -n 1)
        
        if [ -n "$BIN_FILE" ]; then
          echo "Found binary at: $BIN_FILE"
          cp "$BIN_FILE" output/update-binary
        else
          echo "ERROR: Could not locate compiled binary file."
          exit 1
        fi

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: aroma-update-binary
        path: output/update-binary
